name: native-build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcap-dev
      - run: npm ci --ignore-scripts
      - run: node bin/ares.mjs setup
      - run: node bin/astra-ares.mjs --version
      - uses: oven-sh/setup-bun@v2
      - run: JEV_TEST_BINARY="$HOME/.local/share/astra-ares/bin/codex" npm run test:native
